# Generated pages + nav: edit SITE in sync_wiki.py, not the nav below (it is rewritten on every build).
site_name: FoxRe
site_description: Reverse engineering Metal Gear Solid V The Phantom Pain and rebuilding its Fox Engine, clean-room and test-gated.
site_url: https://wannabecoderluc.github.io/foxre-wiki/
repo_name: WannabeCoderLuc/foxre-wiki
repo_url: https://github.com/WannabeCoderLuc/foxre-wiki
copyright: FoxRe project. Unofficial research; not affiliated with Konami. No game files are published.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: material/github
  features:
    # One always-visible sidebar: every section and page is listed from every page.
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Home: index.md
  - Guide:
      - guide/index.md
      - "What this project is": guide/overview.md
      - "Game data: from disk to objects": guide/game-data.md
      - "Classes, properties and entities": guide/classes-and-entities.md
      - "How a frame runs": guide/frame-loop.md
      - "How we verify": guide/verification.md
      - "Glossary": guide/glossary.md
  - Project status:
      - status/index.md
      - "Roadmap": status/roadmap.md
      - "Session log": status/log.md
  - Engine:
      - engine/index.md
      - "Engine modules": engine/modules.md
      - "Reflection and type database": engine/reflection.md
      - "Entities and DataSet loading": engine/entities.md
      - "Scheduler": engine/scheduler.md
      - "Messages and commands": engine/messages.md
      - "Core architecture notes (2026-10-19)": engine/core-architecture.md
  - File formats:
      - formats/index.md
      - "QAR archives": formats/qar.md
      - "FPK / FPKD packages": formats/fpk.md
      - "FOX2 DataSets": formats/fox2.md
      - "FRT route sets": formats/frt.md
      - "NAV2 navmeshes": formats/nav2.md
  - Tools:
      - tools/index.md
      - "MCP server and knowledge DB": tools/mcp-server.md
      - "Installed tools": tools/tooling.md
      - "Background": tools/background.md
