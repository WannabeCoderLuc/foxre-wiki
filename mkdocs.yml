# Generated pages + nav: edit SITE in sync_wiki.py, not the nav below (it is rewritten on every build).
site_name: FoxRe
site_description: Reverse engineering Metal Gear Solid V The Phantom Pain and rebuilding its Fox Engine, clean-room and test-gated.
site_url: https://wannabecoderluc.github.io/foxre-wiki/
repo_name: WannabeCoderLuc/foxre-wiki
repo_url: https://github.com/WannabeCoderLuc/foxre-wiki
copyright: FoxRe project. Unofficial research; not affiliated with Konami. No game files are published.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: material/github
  features:
    # One always-visible sidebar: every section and page is listed from every page.
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

