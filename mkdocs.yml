site_name: FoxRe Wiki
site_description: Fox Engine Reverse Engineering and Technical Architecture Reference (Metal Gear Solid V)
site_author: FoxRe Contributors
site_url: https://wannabecoderluc.github.io/foxre-wiki/

repo_name: WannabeCoderLuc/foxre-wiki
repo_url: https://github.com/WannabeCoderLuc/foxre-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Slate dark mode by default (high-tech / tactical aesthetic)
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Clean light mode
    - scheme: default
      primary: blue-grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

nav:
  - Overview:
      - Home: index.md
      - Roadmap: Roadmap.md
      - Session Log: Session-Log.md
  - Engine Architecture:
      - Modules Overview: Engine-Modules.md
      - Core Architecture: Engine-Core-Architecture.md
      - Reflection & Type DB: Engine-Reflection.md
      - Entity System: Engine-Entities.md
      - Scheduler: Engine-Scheduler.md
      - Messages & Commands: Engine-Messages.md
  - File Formats:
      - QAR Archives: Format-QAR.md
      - FPK Packages: Format-FPK.md
      - FOX2 DataSets: Format-FOX2.md
      - FRT Routes: Format-FRT.md
      - NAV2 Navmesh: Format-NAV2.md
  - Tooling & Reference:
      - MCP Server: MCP-Server.md
      - Tooling & Verification: Tooling.md
      - Project Background: Background.md
